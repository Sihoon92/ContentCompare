[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "contentcompare"
version = "0.1.0"
description = "엑셀 기준 문서를 여러 대상 문서와 LLM 으로 비교하는 에이전트"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pyyaml>=6.0",
    "requests>=2.31",
]

[project.optional-dependencies]
# Windows + MS Office 환경에서만 설치 가능.
office = [
    "xlwings>=0.30",
    "pywin32>=306",
]
ui = [
    "streamlit>=1.30",
]
langchain = [
    "langchain-openai>=0.1",
    "httpx>=0.27",
    # 구조화 출력(llm.structured_output)의 와이어 스키마를 만든다. langchain-openai 가
    # 어차피 끌고 오지만 **명시한다** — 전이 의존성에 기대면 langchain 이 pydantic 을
    # 떼는 날 이 기능이 조용히 꺼지고(schemas.schema_for 가 None 을 돌려주므로 예외조차
    # 안 난다) 아무도 눈치채지 못한다.
    "pydantic>=2.7",
]
fastembed = [
    "fastembed>=0.3",
]
onnx = [
    "onnxruntime>=1.17",
    "tokenizers>=0.15",
    "numpy>=1.24",
]
# LLM 입출력 추적. 설정(llm.langfuse)이 비어 있으면 import 조차 하지 않으므로
# 설치하지 않아도 동작에 영향이 없다.
langfuse = [
    "langfuse>=3.0,<4",
    # 사내 사설 CA 대응. 파이썬은 certifi(공인 CA)만 믿어서 자체호스팅 Langfuse 에
    # CERTIFICATE_VERIFY_FAILED 가 나는데, 브라우저가 붙는 PC 는 루트 CA 가 이미 OS
    # 저장소에 있다. truststore 가 그걸 쓰게 해 PEM 파일을 손으로 만들 필요를 없앤다.
    "truststore>=0.9",
]
dev = [
    "pytest>=7.0",
    # scripts/make_synthetic_targets.py — 테스트용 대상 문서 생성(COM 불필요).
    "python-docx>=1.1",
    "python-pptx>=0.6",
    # 사내 CA 경로 테스트용 자체서명 인증서 생성(없으면 해당 2건만 skip).
    "cryptography>=42.0",
]

[project.scripts]
contentcompare = "contentcompare.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["contentcompare*"]
