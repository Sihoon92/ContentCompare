# 사람이 확정한 개념 관계. 실행이 만든 artifacts/<기준문서>/concept_graph.json 을
# 검토해 확실한 것만 여기로 옮긴다. 여기 있는 쌍은 다음 실행부터 LLM 에 묻지 않는다.
#
# 키는 항목명이며 공백·기호 차이는 무시된다("고객 표준 버전" == "고객표준버전").

# aliases — 같은 개념의 여러 표기(번역어·약칭). 그룹 안은 서로 same_as 이고,
# 아래 same_as/differs_by 의 이름은 그룹 전체로 확장된다. 예를 들어
# "1개월저장온도 ↔ 표준환경온도" 차단은 "1개월저장온도 ↔ Standard ambient temperature"
# 에도 자동으로 걸린다. 번역어를 differs_by 목록에 직접 나열하면 동의어까지
# "다르다"로 선언되므로 반드시 여기에 적을 것.
aliases:
  - ["표준환경온도", "Standard ambient temperature"]
  - ["평가환경습도", "Evaluation ambient humidity"]
  - ["정격충전전압", "Rated charging voltage"]

same_as:
  - names: ["고객 표준 버전", "문서 기준 규격"]
    reason: "둘 다 SEC Req. ver.4.7 을 가리킨다 (2026-08-03 실측 확인)"

differs_by:
  - names: ["1개월저장온도", "표준환경온도"]
    axis: "측정조건"
    reason: "저장 조건과 상시 환경 조건은 다른 규격"
  - names: ["평가환경온도", "평가 환경 습도"]
    axis: "물리량"
    reason: "온도와 습도"
  - names: ["충전환경온도", "정격 충전 전압"]
    axis: "물리량"
    reason: "온도와 전압"
