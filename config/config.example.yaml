# ContentCompare 설정 예시. config.yaml 로 복사 후 환경에 맞게 수정하세요.

llm:
  backend: ollama          # ollama | internal | langchain  ← 이 값만 바꾸면 백엔드 전환
  chat_model: qwen2.5:14b
  embed_model: bge-m3
  timeout: 120
  max_retries: 3           # 일시 오류(연결/타임아웃/5xx/429) 재시도 횟수
  backoff_base: 2          # 지수 백오프 기준(2 → 2s,4s,8s,…)

  ollama:
    host: http://localhost:11434

  # internal(requests 직접 호출) 과 langchain(langchain-openai) 백엔드는
  # 아래 internal 섹션 설정을 공유한다. backend 값만 바꾸면 된다.
  internal:                # 사내(in-house) OpenAI 호환 LLM
    base_url: https://llm.intra.corp/v1
    api_key: ""            # 키를 직접 지정(간단). 비우면 api_key_env 사용
    api_key_env: INTERNAL_LLM_API_KEY   # 위가 비었을 때 읽을 환경변수 이름
    unset_proxy: true      # true 면 시작 시 HTTP(S)_PROXY 를 전역으로 비움(복원 없음)
    verify_ssl: false
    log_proxy: false       # true 면 호출 직전 적용 프록시 env 를 로그로 출력

excel:
  granularity: hybrid       # row | field | hybrid (행=검색, 셀=판정)
  header_row: 1             # 헤더가 시작하는 행(1-based)
  header_rows: 1            # 헤더가 차지하는 행 수(다단 헤더면 2 이상)
  key_columns: []           # 행 식별 키. 헤더명 또는 1-based 인덱스. 비면 자동 추정
  compare_columns: null     # 비교 대상 컬럼. null=키/스킵 제외 전체
  skip_columns: []          # 비교 제외 컬럼(헤더명/인덱스)
  value_as_displayed: true  # 화면 표시문자(서식 적용)로 비교. false=원시값
  max_rows: null            # 비교할 최대 row 수(null=전체)

similarity:
  recall_k: 30             # 1차 검색(임베딩·BM25)에서 각각 추릴 후보 수
  top_k: 10                # MMR 후 LLM 에 투입할 최종 후보 수
  fusion: rrf              # rrf(임베딩+BM25) | cosine(임베딩 단독)
  rrf_k: 60                # RRF 상수
  mmr_lambda: 0.5          # MMR 관련도/다양성 가중(1=관련도, 0=다양성)
  per_doc_cap: 4           # 한 대상 문서의 최종 후보 상한
  rerank: false            # 교차 인코더 재랭킹(Phase 2.5, 기본 off)
  cache_dir: .cache/embeddings  # 임베딩 디스크 캐시(빈 값이면 비활성)
  chunk_chars: 800         # 긴 항목 청킹 길이
  min_score: 0.0           # fusion=cosine 일 때만 쓰는 코사인 임계값

report:
  format: markdown
