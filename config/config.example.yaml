# ContentCompare 설정 예시. config.yaml 로 복사 후 환경에 맞게 수정하세요.

llm:
  backend: ollama          # ollama | internal | langchain  ← chat 백엔드
  embed_backend: ""        # 비우면 backend 와 동일. 사내 chat 이 임베딩을 안 주면
                           # fastembed | onnx(직접받은폴더) | ollama 로 분리 지정
  chat_model: qwen2.5:14b
  embed_model: bge-m3      # fastembed 면 지원모델명 사용. 다국어 권장: intfloat/multilingual-e5-large
                           # (미지원 에러 시 메시지의 '지원 목록' 참고, 또는 pip install -U fastembed)
  embed_cache_dir: ""      # (fastembed) 오프라인: 미리 받아둔 fastembed 캐시 폴더
  embed_model_path: ""     # (onnx) 직접 받은 ONNX 모델 폴더 경로(model.onnx + tokenizer.json)
  embed_prefix: ""         # 공통 접두어(아래 query/passage 미지정 시 폴백). e5 면 'query: '
  # e5 계열(multilingual-e5-large 등)은 검색어/본문에 다른 접두어가 필요하다.
  # 한↔영 등 교차언어 검색 정확도를 위해 아래처럼 분리 지정 권장(비우면 embed_prefix 폴백):
  embed_query_prefix: ""     # 검색어(기준 항목)용. e5 권장: 'query: '
  embed_passage_prefix: ""   # 본문(대상 청크)용.   e5 권장: 'passage: '
  timeout: 120
  max_retries: 3           # 일시 오류(연결/타임아웃/5xx) 재시도 횟수
  backoff_base: 2          # 지수 백오프 기준(2 → 2s,4s,8s,…)
  rate_limit_wait: 60      # 요청 한도(HTTP 429) 시 대기 초. 서버 Retry-After 가 있으면 그 값 우선
  rate_limit_max_retries: 5  # 429 전용 재시도 횟수(분당 한도 회복용, 일반 재시도와 별도)

  ollama:
    host: http://localhost:11434
    num_ctx: 16384         # 컨텍스트 창(토큰). 0=미지정(Ollama 기본 4096).
                           # fact 엔진은 표 전체를 한 프롬프트에 넣어 4096 을 쉽게 넘고,
                           # 초과 시 Ollama 는 오류가 아니라 빈 응답을 준다 → 반드시 상향.
    think: false           # thinking 모델의 사고 과정 사용 여부(미지정하려면 줄 삭제).
                           # false 면 훨씬 빠르고(실측 219s→26s) 컨텍스트를 답변에만 쓴다.
                           # thinking 미지원 모델에 지정하면 Ollama 가 거부할 수 있다.

  # internal(requests 직접 호출) 과 langchain(langchain-openai) 백엔드는
  # 아래 internal 섹션 설정을 공유한다. backend 값만 바꾸면 된다.
  internal:                # 사내(in-house) OpenAI 호환 LLM
    base_url: https://llm.intra.corp/v1
    api_key: ""            # 키를 직접 지정(간단). 비우면 api_key_env 사용
    api_key_env: INTERNAL_LLM_API_KEY   # 위가 비었을 때 읽을 환경변수 이름
    unset_proxy: true      # true 면 시작 시 HTTP(S)_PROXY 를 전역으로 비움(복원 없음)
    verify_ssl: false
    log_proxy: false       # true 면 호출 직전 적용 프록시 env 를 로그로 출력

excel:
  granularity: hybrid       # row | field | hybrid (행=검색, 셀=판정)
  header_row: 1             # 헤더가 시작하는 행(1-based)
  header_rows: 1            # 헤더가 차지하는 행 수(다단 헤더면 2 이상 → '정량규격>하한치' 결합)
  skip_banner_rows: true    # '대외비'처럼 전열 통합된 배너행을 헤더에서 자동 제외
  auto_header: false        # true 면 LLM 이 상위 행을 보고 헤더 시작/행수를 자동 추정
  key_columns: []           # 행 식별 키. 헤더명 또는 1-based 인덱스. 비면 자동 추정
  compare_columns: null     # 비교 대상 컬럼. null=키/스킵 제외 전체
  skip_columns: []          # 비교 제외 컬럼(헤더명/인덱스)
  value_as_displayed: true  # 화면 표시문자(서식 적용)로 비교. false=원시값
  max_rows: null            # 비교할 최대 row 수(null=전체)

similarity:
  recall_k: 30             # 1차 검색(임베딩·BM25)에서 각각 추릴 후보 수
  top_k: 10                # MMR 후 LLM 에 투입할 최종 후보 수
  fusion: rrf              # rrf(임베딩+BM25) | cosine(임베딩 단독)
  rrf_k: 60                # RRF 상수
  mmr_lambda: 0.5          # MMR 관련도/다양성 가중(1=관련도, 0=다양성)
  per_doc_cap: 4           # 한 대상 문서의 최종 후보 상한
  rerank: false            # 교차 인코더 재랭킹(Phase 2.5, 기본 off)
  cache_dir: .cache/embeddings  # 임베딩 디스크 캐시(빈 값이면 비활성)
  chunk_chars: 800         # 긴 항목 청킹 길이
  min_score: 0.0           # fusion=cosine 일 때만 쓰는 코사인 임계값

report:
  format: markdown
  output_dir: reports      # 생성한 리포트(.md)를 자동 저장하는 곳(Streamlit '리포트 보기'가 읽음)

knowledge:                 # 사람이 작성하는 도메인 지식(human-in-the-loop, 요청 5번)
  enabled: true            # true 면 dir 의 모든 .md 를 비교 프롬프트에 참고자료로 항상 주입
  dir: knowledge           # 지식 Markdown 파일들이 있는 디렉터리
  max_chars: 12000         # 프롬프트에 주입할 지식 최대 길이(초과분은 잘림)

fact:                      # 신규 fact 파이프라인(--engine fact 일 때만 사용)
  artifacts_dir: "artifacts"       # 중간 산출물 저장 루트(artifacts/<문서>/<단계>.json)
  save_artifacts: true             # 중간 산출물 항상 저장
  cache: true                      # 단계별 산출물 캐싱(같은 입력이면 재호출 0)
  max_llm_calls_per_doc: 50        # 문서당 LLM 호출 예산
  record_batch_rows: 30            # F2: 한 LLM 호출당 정규화할 데이터 행 수
  fact_batch_blocks: 20            # F3: 한 LLM 호출당 처리할 Word/PPT 블록/도형 수
  max_repair_iters: 2              # Repair Loop 최대 반복(F4b, 미구현)
  # --- 비교 단계(F5) ---
  match_top_k: 3                   # 기준 fact 하나당 검토할 대상 후보 수
  match_min_score: 0.65            # 후보 인정 최소 임베딩 코사인(미만이면 '대상에 없음')
                                   # 실측 근거: 정답 0.697~0.808 vs 오매칭 0.449~0.700
  match_review_score: 0.75         # 이 미만이면 코드 단독 판정을 믿지 않고 LLM 에 위임
  compare_use_llm: true            # false 면 코드 판정만(애매한 건 전부 판단보류)
  max_llm_calls_per_compare: 100   # 비교 단계 LLM 호출 예산(문서 처리 예산과 별도)
